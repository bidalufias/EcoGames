<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EcoGames · Learn through play</title>
    <meta
      name="description"
      content="Free, quick browser games about climate, energy, nature and waste, for all ages."
    />
    <meta name="theme-color" content="#2e9e62" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('ecogames:theme'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>EcoGames needs JavaScript to run the games.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
